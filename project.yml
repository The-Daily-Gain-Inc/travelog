name: Travelog
options:
  bundleIdPrefix: ca.thedailygain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  Travelog:
    type: application
    platform: iOS
    sources:
      - Travelog/Sources
      - Travelog/Resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: ADPUGXVDZQ
        CODE_SIGN_STYLE: Automatic
    info:
      path: Travelog/Info.plist
      properties:
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        GIDClientID: $(GOOGLE_CLIENT_ID)
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ca.thedailygain.Travelog.refresh
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_URL_SCHEME)
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
