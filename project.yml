name: Travelog
options:
  bundleIdPrefix: ca.thedailygain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  Travelog:
    type: application
    platform: iOS
    sources:
      - path: Travelog/Sources
      - Travelog/Resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: TravelogWidget
    entitlements:
      path: Travelog/Travelog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ca.thedailygain.Travelog
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: ADPUGXVDZQ
        CODE_SIGN_STYLE: Automatic
    info:
      path: Travelog/Info.plist
      properties:
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        GIDClientID: $(GOOGLE_CLIENT_ID)
        NSPhotoLibraryAddUsageDescription: Travelog saves photos you choose to your library.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: Travelog.ExternalSceneDelegate
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ca.thedailygain.Travelog.refresh
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_URL_SCHEME)
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig

  TravelogWidget:
    type: app-extension
    platform: iOS
    sources:
      - TravelogWidget
      - Travelog/Sources/Widget/WidgetSnapshot.swift
    entitlements:
      path: TravelogWidget/TravelogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ca.thedailygain.Travelog
    info:
      path: TravelogWidget/Info.plist
      properties:
        CFBundleDisplayName: Travelog
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.thedailygain.Travelog.widget
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ADPUGXVDZQ
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
